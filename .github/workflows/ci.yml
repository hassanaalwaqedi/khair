name: Khair CI

on:
  pull_request:
    branches: [ "main", "develop" ]
  push:
    branches: [ "main", "develop" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum
          
      - name: Build Backend
        working-directory: ./backend
        run: go build -v ./...
        
      - name: Test Backend
        working-directory: ./backend
        run: go test -v ./...

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.x' # Use specific version matching your environment
          
      - name: Install dependencies
        working-directory: ./frontend/khair_app
        run: flutter pub get
        
      - name: Analyze Code
        working-directory: ./frontend/khair_app
        run: flutter analyze
        
      - name: Run Tests
        working-directory: ./frontend/khair_app
        run: flutter test
