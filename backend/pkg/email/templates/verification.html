<div dir="{{DIR}}" style="font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
  <img src="{{BRAND_LOGO_URL}}" alt="Khair" style="height: 40px; margin-bottom: 20px;" />
  <h2>{{TITLE}}</h2>
  <p>{{GREETING}}</p>
  <p>{{INTRO}} {{EXPIRY}}</p>
  <div dir="ltr" style="margin: 20px 0;">
    <strong style="font-size: 24px; letter-spacing: 5px;">{{CODE}}</strong>
  </div>
  <p>{{SECURITY_TITLE}} {{SECURITY_BODY}}</p>
  <p><small>{{IGNORE_TEXT}}</small></p>
  <hr style="margin: 20px 0; border: none; border-top: 1px solid #ccc;" />
  <p><small>{{FOOTER}} &middot; {{COPYRIGHT}}</small></p>
</div>
